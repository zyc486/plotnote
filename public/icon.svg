<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- 背景光泽 -->
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>

  <!-- 底部装饰条纹 -->
  <rect x="0" y="380" width="512" height="132" rx="0" fill="rgba(0,0,0,0.12)"/>
  <rect x="0" y="380" width="512" height="132" rx="108" fill="url(#bg)" opacity="0.85"/>

  <!-- 笔记本主体（白色卡片） -->
  <rect x="120" y="80" width="272" height="340" rx="20" fill="white" filter="url(#shadow)"/>

  <!-- 笔记本顶部装饰条 -->
  <rect x="120" y="80" width="272" height="52" rx="20" fill="#e0e7ff"/>
  <rect x="120" y="112" width="272" height="20" fill="#e0e7ff"/>

  <!-- 胶片孔（左侧） -->
  <rect x="136" y="92" width="28" height="14" rx="4" fill="#a5b4fc"/>
  <rect x="136" y="116" width="28" height="14" rx="4" fill="#a5b4fc"/>

  <!-- 胶片孔（右侧） -->
  <rect x="348" y="92" width="28" height="14" rx="4" fill="#a5b4fc"/>
  <rect x="348" y="116" width="28" height="14" rx="4" fill="#a5b4fc"/>

  <!-- 播放按钮（三角形） -->
  <circle cx="256" cy="220" r="36" fill="#6366f1"/>
  <polygon points="248,205 248,235 272,220" fill="white"/>

  <!-- 文字行（模拟笔记） -->
  <rect x="160" y="280" width="192" height="8" rx="4" fill="#c7d2fe"/>
  <rect x="160" y="300" width="140" height="8" rx="4" fill="#ddd6fe"/>
  <rect x="160" y="320" width="170" height="8" rx="4" fill="#e0e7ff"/>

  <!-- 星标评分 -->
  <g transform="translate(256, 360)">
    <polygon points="0,-14 4,-4 15,-5 7,2 9,13 0,7 -9,13 -7,2 -15,-5 -4,-4" fill="#fbbf24"/>
  </g>

  <!-- 底部品牌文字 -->
  <text x="256" y="445" text-anchor="middle" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="52" fill="white" letter-spacing="2">PlotNote</text>
</svg>
